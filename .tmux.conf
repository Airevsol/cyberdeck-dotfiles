# CYBERDECK // tmux
# split the screen like a netrunner. neon HUD rides the bottom edge.

set -g default-terminal "screen-256color"
set -g mouse on
set -g base-index 1
set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=#0a0a12,fg=#05d9e8"
set -g status-left-length 30
set -g status-left "#[bg=#ff2a6d,fg=#0a0a12,bold] #S #[bg=#0a0a12] "
set -g window-status-format "#[fg=#4a5a6a] #I:#W "
set -g window-status-current-format "#[bg=#05d9e8,fg=#0a0a12,bold] #I:#W "
set -g status-right-length 90
set -g status-right "#[fg=#ffb000]LOAD #(cut -d' ' -f1 /proc/loadavg) #[fg=#ff2a6d]:: #[fg=#05d9e8]PWR #(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)% #[fg=#ff2a6d]:: #[fg=#d1f7ff]%Y.%m.%d %H:%M "

set -g pane-border-style "fg=#1a1a2e"
set -g pane-active-border-style "fg=#ff2a6d"
set -g message-style "bg=#ff2a6d,fg=#0a0a12"
set -g mode-style "bg=#05d9e8,fg=#0a0a12"
set -g clock-mode-colour "#ff2a6d"
