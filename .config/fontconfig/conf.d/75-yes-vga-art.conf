<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CYBERDECK // lets the old IBM VGA glyphs through the gate,
     so the fastfetch skull renders in the font of the BBS era. -->
<fontconfig>
  <selectfont><acceptfont><pattern>
    <patelt name="family"><string>VGA Art</string></patelt>
  </pattern></acceptfont></selectfont>
  <selectfont><acceptfont><pattern>
    <patelt name="family"><string>Bm437 IBM VGA 8x16</string></patelt>
  </pattern></acceptfont></selectfont>
</fontconfig>
